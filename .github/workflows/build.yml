name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.0
      - &java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw verify --batch-mode --fail-at-end
        env:
          GH_USERNAME: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.0
      - *java
      - run: ./mvnw clean verify --batch-mode --fail-at-end
        env:
          GH_USERNAME: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}

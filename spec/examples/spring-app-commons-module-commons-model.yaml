# Kalyx Configuration for module/commons-model
# Compare to: module/commons-model/build.gradle.kts

#
SPDX-FileCopyrightText: Copyright © 2023-2026 Caleb Cushing
SPDX-License-Identifier: MIT

# Inherits everything from root - zero additional config needed for basics

# Just declare module-specific dependencies
dependencies:
  api:
    - org.springframework.data:spring-data-commons:${spring-boot}
    - org.jmolecules:jmolecules-ddd:2025.x

# Test dependencies - much simpler than Gradle's testing { suites { } }
test:
  dependencies:
    implementation:
      - com.xenoterracide:tools:0.x
      - jakarta.persistence:jakarta.persistence-api:${jakarta}
      - org.springframework:spring-beans:${spring-boot}
      - org.springframework.boot:spring-boot-data-jpa-test:${spring-boot}
    runtimeOnly:
      - project:test-app-core
      - com.h2database:h2:2.x
      - org.springframework.boot:spring-boot-starter-data-jpa:${spring-boot}
      # Bundle expansion happens automatically
      - jakarta.transaction:jakarta.transaction-api:${jakarta}
      - jakarta.enterprise:jakarta.enterprise.cdi-api:${jakarta}
      - jakarta.enterprise:jakarta.enterprise.lang-model:${jakarta}
      - jakarta.interceptor:jakarta.interceptor-api:${jakarta}
      - jakarta.inject:jakarta.inject-api:${jakarta}

# That's it. No boilerplate.
# Compare to 37 lines of Gradle Kotlin DSL.
